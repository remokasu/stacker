[build-system]
requires = ["setuptools>=42", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pystacker"
version = "1.36.0"
authors = [
    {name = "remokasu"}
]
description = "Stacker: RPN Calculator in Python"
readme = "README.md"
license = {file = "LICENSE"}
keywords = ["reverse-polish-calculator", "rpn", "terminal-app"]
requires-python = ">=3.10"
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: Implementation :: CPython",
    "Programming Language :: Python :: Implementation :: PyPy",
    "Topic :: Software Development :: Interpreters",
]
dependencies = ["prompt-toolkit>=3.0.0"]

[project.urls]
Homepage = "https://github.com/remokasu/stacker"

[project.scripts]
stacker = "stacker.__main__:main"

[tool.setuptools]
packages = [
    "stacker",
    "stacker.engine",
    "stacker.engine.primitives",
    "stacker.lang",
    "stacker.operators",
    "stacker.plugins",
    "stacker.runtime",
    "stacker.runtime.exec_modes",
    "stacker.slib",
    "stacker.syntax",
]
package-data = {"stacker" = [
    "data/*",
], "stacker.slib" = [
    "*.stk",
]}